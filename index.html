<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ---------- Nagłówek ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

.clk{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}

.seg.f button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.seg.f button.on .dot{background:#000}

/* Teraz */
.hero{background:var(--s1);border-radius:20px;padding:18px;border:1px solid var(--line);position:relative;overflow:hidden}

.hero .bd{margin-top:6px}
.nxt{margin-top:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.nxt .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.nxt .k{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--tx2);text-transform:uppercase}
.nxt .p{font-size:16px;font-weight:600;margin-top:1px}
.grp{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gi{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.gi:first-child{border-top:0}
.gi .lb{flex:none;font-size:11px;font-weight:800;letter-spacing:.05em;padding:4px 6px;border-radius:5px;background:var(--c);color:#000;min-width:38px;text-align:center}
.gi .x{flex:1;min-width:0;font-size:15px}
.gi .x small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.empty{color:var(--tx3);text-align:center;padding:22px;font-size:14px}

/* Karty planu */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);margin:2px 2px 12px}
.prog .pbar{flex:1;margin:0;height:5px}
.prog .pbar i{background:var(--ex)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;position:relative;overflow:hidden}

.ch{display:flex;gap:12px;padding:13px 12px 13px 16px;align-items:flex-start;cursor:pointer}
.ch .tm{flex:none;width:50px;font-variant-numeric:tabular-nums}
.ch .tm b{display:block;font-size:17px}
.ch .tm span{font-size:13px;color:var(--tx3)}
.ch .mid{flex:1;min-width:0}
.ch .pl{font-size:16.5px;font-weight:650;line-height:1.25}
.ch .meta{font-size:12.5px;color:var(--tx2);margin-top:3px}
.pills{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 6px;border-radius:5px;background:var(--s3);color:var(--tx2)}
.pill.g{background:var(--c);color:#000}
.pill.must{border:1px solid var(--red);background:none;color:#fff}
.pill.nw{background:var(--red);color:#fff}
.pill.nx{background:#fff;color:#000}
.ck{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #4a4a4a;display:grid;place-items:center;margin-top:1px}
.ck svg{width:16px;height:16px;opacity:0}
.card.done .ck{background:var(--ex);border-color:var(--ex)}
.card.done .ck svg{opacity:1}
.card.done{opacity:.42}
.card.done .pl{text-decoration:line-through}
.card.past:not(.done){opacity:.7}
.card.isnow{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.card .bd{display:none;padding:0 14px 14px 16px;border-top:1px solid var(--line)}
.card.open .bd{display:block}
.nowline{display:flex;align-items:center;gap:8px;color:var(--red);font-size:12px;font-weight:700;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.nowline::before,.nowline::after{content:"";height:2px;background:var(--red);flex:1;border-radius:2px}
.nowline::before{flex:0 0 10px}

/* Treść szczegółów (z oryginału) */
.bd .txt,.info .txt{white-space:pre-wrap;margin-top:10px;color:#e6e6e6;font-size:15px}
.bd .row,.info .row{margin-top:8px;font-size:14.5px;color:#d6d6d6}
.row b{color:#fff}
.row.warn{background:rgba(198,53,44,.12);border-radius:8px;padding:7px 9px}
.row.warn b{color:#ff6b61}
.an{margin-top:10px;border-left:3px solid #fff;padding-left:10px;color:#eee;font-size:14.5px}
.qb{margin-top:12px;background:#000;border:1px solid var(--line);border-radius:12px;padding:11px}
.qb h4{font-size:11.5px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.evs{margin-top:14px}

/* ---------- Dolny pasek ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(12,12,12,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}

.toast.on{opacity:1}

"pom","bg":"#6AA84F1f"},{"s":600,"e":630,"lt":"10:00","t":"Waga","kind":"warto","bg":"#6AA84F3d"},{"s":660,"e":690,"lt":"11:00","t":"Śniadanie","kind":"warto","bg":"#6AA84F3d"},{"s":690,"e":720,"lt":"11:30","t":"Podsumowanie przez instruktorów","kind":"warto","bg":"#6AA84F3d"},{"s":720,"e":780,"lt":"12:00","t":"Feedback od grupy, 10 min na osobę","kind":"must","bg":"#6AA84F66"},{"s":780,"e":1020,"lt":"13:00","t":"Kółko: rozmowy indywidualne, biofeedback","kind":"must","bg":"#6AA84F66"},{"s":780,"e":840,"lt":"13:00","t":"Obsługa sprzętu (pontony)","kind":"must","bg":"#6AA84F66"},{"s":840,"e":870,"lt":"14:00","t":"Obiad","kind":"must","bg":"#6AA84F66"},{"s":1020,"e":1050,"lt":"17:00","t":"Wręczenie nagród (ryngrafy, gromowiec, pudełka)","kind":"must","bg":"#6AA84F66"}]}],"axis":[0,1140]}],"info":[{"id":"zal","title":"Założenia media planu","html":"<h3>Cel wyjazdu<\/h3><div class=\"txt\">Jedziemy nagrać trzy wydarzenia naraz w Bieszczadach i zrobić z nich materiały, które sprzedają Challenge sponsorom i patronom na kolejne lata. Baza to OW Bystre (Baligród).<\/div><h3>Trzy wydarzenia<\/h3><div class=\"txt\">• Challenge (18-19.11, 24 godziny): wydarzenie fundacyjne dla młodzieży (w programie max 25 osób i 4 szkoły, Wojtek mówił o 15-20 uczestnikach) połączonej ze starszymi. Jest cykliczne, więc ma się dobrze sprzedać w przyszłym roku.<\/div><div class=\"txt\">• Advanced (18-21.11): nowy produkt, w praktyce Extreme plus. Grupa po szkoleniach SSwB, która chciała czegoś więcej. Pokazujemy im selekcyjny świat na kolejnym poziomie.<\/div><div class=\"txt\">• Extreme (18-22.11): robimy po staremu, tu wiemy najwięcej, co nagrywać.<\/div><h3>Czego chce Wojtek (organizator)<\/h3><div class=\"txt\">1. Materiał marketingowy pod sponsorów i patronów kolejnych edycji Challenge: młodzież, łączenie pokoleń, starsi obok młodych.<\/div><div class=\"txt\">2. Promocja samego Challenge wśród młodzieży.<\/div><div class=\"txt\">3. Treści na social media SSWB, LHD i kanał Savika.<\/div><div class=\"txt\">4. Reklama SSwB, sponsorów oraz Pitusia, Darka i C12.<\/div><div class=\"txt\">5. Odcinek specjalny „20 lat po selekcji”.<\/div><div class=\"txt\">6. Ludzka twarz w testach i trudnych momentach. Na tym mu najbardziej zależy.<\/div><h3>Co powstaje z nagrywek<\/h3><div class=\"txt\">Z jednego wyjazdu powstają cztery rodzaje materiałów. Ostateczna liczba filmów nie jest jeszcze zdecydowana.<\/div><div class=\"kv\"><div class=\"t\">Film o Challenge<\/div><div class=\"row\"><b>Co to jest: <\/b>Film typowo o Challenge, pod sponsorów i patronów oraz promocję wśród młodzieży. Zaznaczamy w nim, że impreza dzieje się w trakcie innych wydarzeń SSwB. To uprawomocnia wstawki z innych wydarzeń (liny, pontony).<\/div><div class=\"row\"><b>Status: <\/b>Ustalone<\/div><\/div><div class=\"kv\"><div class=\"t\">Odcinek u Sawika<\/div><div class=\"row\"><b>Co to jest: <\/b>Sawik montuję sam. Dostaje ok. 2 h materiału, z czego Karol składa ok. 1 h. Wojtek spotyka się z nim (studio albo ognisko) i komentują film oraz projekt. Materiały przeplatane: Challenge i SSWB. Ma to być odcinek, w którym komentują to, co zrobiono tydzień wcześniej.<\/div><div class=\"row\"><b>Status: <\/b>Ustalone<\/div><\/div><div class=\"kv\"><div class=\"t\">Odcinek specjalny „20 lat po selekcji” (SSWB)<\/div><div class=\"row\"><b>Co to jest: <\/b>Rozmowa Krawca i Karasia przy ognisku. Od chłopaka z podstawówki do dziś, z wyjaśnieniem, skąd ich idee.<\/div><div class=\"row\"><b>Status: <\/b>Ustalone, pytania do ułożenia<\/div><\/div><div class=\"kv\"><div class=\"t\">Materiały Extreme i Advanced (SSWB)<\/div><div class=\"row\"><b>Co to jest: <\/b>Osobno od Challenge. Warianty: jeden odcinek o Advanced i Extreme albo 2 odcinki o każdym z wydarzeń osobno.<\/div><div class=\"row\"><b>Status: <\/b>Nierozstrzygnięte<\/div><\/div><div class=\"kv\"><div class=\"t\">Social media<\/div><div class=\"row\"><b>Co to jest: <\/b>Stories i krótkie rolki.<\/div><div class=\"row\"><b>Status: <\/b>Ustalone<\/div><\/div><h3>Sponsorzy i marki do pokazania w kadrze<\/h3><div class=\"txt\">Dziewięć marek do pokazania w kadrze. Konkretne ujęcia przy markach oznaczonych „marka w kadrze” trzeba jeszcze ustalić.<\/div><div class=\"kv\"><div class=\"t\">Helikon<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Dostaliśmy od nich za darmo nerki. Flagi na strzelnicy, wszyscy w Helikonie. Umowa luźna, ma wyjść naturalnie.<\/div><\/div><div class=\"kv\"><div class=\"t\">Rukola (Darek)<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Dostajemy jedzenie na Challenge: sfilmować wydawanie posiłków.<\/div><\/div><div class=\"kv\"><div class=\"t\">LHD (Largo House Defense)<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Paczki z amunicją, flagi, czapki.<\/div><\/div><div class=\"kv\"><div class=\"t\">Siły Specjalne w Biznesie<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Marka w kadrze.<\/div><\/div><div class=\"kv\"><div class=\"t\">Bieg Morskiego Komandosa<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Marka w kadrze.<\/div><\/div><div class=\"kv\"><div class=\"t\">Projekt Moc (firma Kaliego)<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Marka w kadrze.<\/div><\/div><div class=\"kv\"><div class=\"t\">Furia / C12 (Darek Polak)<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Marka w kadrze.<\/div><\/div><div class=\"kv\"><div class=\"t\">Selekcja Trwa (Pituś)<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Marka w kadrze.<\/div><\/div><div class=\"kv\"><div class=\"t\">ARPOL<\/div><div class=\"row\"><b>Co mamy / co pokazać: <\/b>Dostaniemy od nich za darmo eski i racje żywnościowe: pokazać je w użyciu.<\/div><\/div><div class=\"txt\">Przykład z festiwalu w Łodzi: sponsor ma listę ujęć, które muszą się pojawić.<\/div><h3>Jak nagrywamy pod film (ustalenie Konrada)<\/h3><div class=\"txt\">1. Najpierw piszemy idealny scenariusz filmu: od jakiej sceny zaczyna się, jakie słowa padają, jaki materiał po nich.<\/div><div class=\"txt\">2. Dopiero potem decydujemy, co nagrać na miejscu.<\/div><div class=\"txt\">3. Czego nie wypowiedzą na miejscu, doczytują na lektorze (kartka tekstu, podcastowo).<\/div><h3>Forma odcinków o Extreme i Advanced<\/h3><div class=\"txt\">Odcinki o Extreme i o Advanced robimy w formie selekcji, w stylu filmu o selekcji. Jest o tym wydarzeniu, ale nie pokazuje, co się tam naprawdę dzieje. Pokazuje całą drogę tych ludzi: co przechodzą, kim są, w jak ciężkich warunkach to robią. Ma być motywujący, tak żeby po obejrzeniu powiedzieć: wow.<\/div><div class=\"txt\">• Nie pokazujemy kluczowych momentów, tak jak film o selekcji nie zdradza, co jest na Selekcji.<\/div><div class=\"txt\">• My też nie zdradzamy, co jest na naszym Extreme.<\/div><h3>Propozycje z pierwszego zarysu (do weryfikacji po spotkaniu)<\/h3><div class=\"txt\">• Intro z najmocniejszymi momentami i narrator (Mariusz, Karaś albo obaj) z wzmianką o selekcji sprzed 20 lat. Spotkanie podważyło ten pomysł w formie lektora na gorąco.<\/div><div class=\"txt\">• Czas na ekranie (np. 04:30) jako spójka we wszystkich odcinkach.<\/div><div class=\"txt\">• Sen i pobudka zaplanowane, jak w filmie o selekcji, plus backstage i narady z całą ekipą (Czarny, Medyk, Jacek Górka, Darek).<\/div><div class=\"txt\">• Punkt odniesienia: nowa Selekcja Arkadiusza Kupsa, ale bez setek ujęć. Na spotkaniu padło też porównanie do filmu „Selekcja do GROM”.<\/div><h3>Pytania do instruktorów<\/h3><div class=\"txt\">• Jak wyglądała Twoja selekcja?<\/div><div class=\"txt\">Do instruktorów, którzy przeszli selekcję w jednostkach specjalnych (kto dokładnie, do ustalenia):<\/div><div class=\"txt\">• Co z tego, co tu robimy, jest najbliższe Twojej selekcji?<\/div><div class=\"txt\">• Co w tym szkoleniu przypomina Ci selekcję, a co jest zupełnie inne?<\/div><div class=\"txt\">• Czego ludzie tu doświadczają, co kiedyś przeżyłeś sam?<\/div><h3>Pytania do Pitusia<\/h3><div class=\"txt\">• Jakie cechy wspólne widzisz w ludziach, którzy przyjeżdżają tutaj, i w ludziach, którzy idą do jednostek specjalnych?<\/div><h3>Pytania do Kasi (psycholog z GROM-u, jest tylko na Advanced i Extreme)<\/h3><div class=\"txt\">• Jakich ludzi ciągnie do takich szkoleń i co ich do tego popycha?<\/div><div class=\"txt\">• Jakie cechy wspólne widzisz w ludziach, którzy przechodzą selekcję do GROM-u, i w tych, którzy przyjeżdżają tutaj?<\/div><div class=\"txt\">• Czy da się po kilku godzinach zobaczyć, kto da radę, a kto nie?<\/div><div class=\"txt\">• Co dzieje się w głowie człowieka po 24 godzinach bez snu i jedzenia?<\/div><div class=\"txt\">• W którym momencie ludzie najczęściej odpuszczają i co wtedy myślą?<\/div><div class=\"txt\">• Co pozwala wytrzymać wtedy, kiedy ciało już nie daje rady?<\/div><div class=\"txt\">• Co psycholog widzi na selekcji, czego nie widzi nikt inny?<\/div><div class=\"txt\">• Czym się różni człowiek, który odpada, od tego, który zostaje?<\/div><div class=\"txt\">• Co sprawdza się lepiej: siła, spryt czy odporność psychiczna?<\/div><div class=\"txt\">• Czym różni się człowiek, który przychodzi na Advanced po szkoleniach, od tego, który zaczyna od zera?<\/div><div class=\"txt\">• Co zmienia się w człowieku po takim wyjeździe i czy to się utrzymuje po powrocie do domu?<\/div><div class=\"txt\">• Jak ludzie wracają do normalnego życia po takich przeżyciach?<\/div><div class=\"txt\">• Jak można mentalnie przygotować się do selekcji?<\/div>"},{"id":"wyw","title":"Pytania do wywiadów","html":"<div class=\"txt\">Zasada: na każdym starcie 2-3 rozmowy ze świeżymi uczestnikami, na końcu te same osoby. Pytania o zmęczenie i granicę zadajemy dopiero po kilku godzinach w terenie. Konrad może prowadzić wywiad sam, jeśli zna ideę filmu i listę pytań. Andrzej solo wywiadów nie prowadzi.<\/div><h3>Wspólne: na start (wszystkie grupy)<\/h3><div class=\"sub\">Challenge, Advanced, Extreme<\/div><div class=\"qi\"><i>1<\/i><div>Co dla Ciebie znaczy patriotyzm?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Co myślisz o obronności kraju?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Jaki masz plan na przyszłość i co na Ciebie wpływa?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Kto jest Twoim idolem?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>Dlaczego tu jesteś?<small>Propozycja z pierwszego zarysu<\/small><\/div><\/div><div class=\"qi\"><i>6<\/i><div>Jak się przygotowywałeś do tego wyjazdu?<small>Pytanie o przygotowanie<\/small><\/div><\/div><div class=\"qi\"><i>7<\/i><div>Jeśli w grupie są dziewczyny, koniecznie z nimi.<small>Nie pytanie, a wskazówka<\/small><\/div><\/div><h3>Wspólne: na koniec (te same grupy)<\/h3><div class=\"sub\">Challenge, Advanced, Extreme<\/div><div class=\"qi\"><i>1<\/i><div>Czy tego się spodziewałeś, co o tym sądzisz?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Czego się nauczyłeś?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Czy to zmieni Twoje życie albo postrzeganie?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Czy jesteś dobrze przygotowany?<\/div><\/div><h3>Extreme: wejście<\/h3><div class=\"sub\">Czw 19.11, 05:00-06:30, Hotel Bystre<\/div><div class=\"qi\"><i>1<\/i><div>Dlaczego zapisałeś się na Extreme? Co chcesz sobie udowodnić?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Czego się spodziewasz i czego się boisz najbardziej?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Ile spałeś i jak się przygotowałeś?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Co zrobisz, kiedy będziesz miał dość o 3 w nocy?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>Kto wie, że tu jesteś, i co Ci powiedział?<\/div><\/div><div class=\"qi\"><i>6<\/i><div>Jak się przygotowywałeś do Extreme? Od kiedy i co robiłeś?<small>Pytanie o przygotowanie<\/small><\/div><\/div><div class=\"qi\"><i>7<\/i><div>Co przygotowałeś ciałem, a co głową?<small>Pytanie o przygotowanie<\/small><\/div><\/div><div class=\"qi\"><i>8<\/i><div>Czego nie udało Ci się przygotować?<small>Pytanie o przygotowanie<\/small><\/div><\/div><h3>Extreme: po killing house<\/h3><div class=\"sub\">Czw 19.11, 13:45-15:00, Strzelnica Bukowsko<\/div><div class=\"qi\"><i>1<\/i><div>Co się właśnie wydarzyło? Co czułeś przed wejściem?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Co byś zrobił inaczej?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Czy to jest to, czego się spodziewałeś?<\/div><\/div><h3>Extreme: w trakcie<\/h3><div class=\"sub\">Zmęczenie, marsz, noc<\/div><div class=\"qi\"><i>1<\/i><div>Co teraz trzyma Cię w grze?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Gdzie jest Twoja granica? Czy już ją widziałeś?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>O czym myślisz, idąc?<\/div><\/div><h3>Extreme: finał<\/h3><div class=\"sub\">Nd 22.11, 12:00-13:00 oraz po 10 min indywidualnie 13:00-17:00<\/div><div class=\"qi\"><i>1<\/i><div>Czego się o sobie dowiedziałeś, czego nie wiedziałeś w czwartek?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Co było najtrudniejsze i dlaczego?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Co zabierasz do domu, do pracy, do rodziny?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Czy poleciłbyś to komuś i komu nie?<small>Pytanie pod promocję, do potwierdzenia z Wojtkiem<\/small><\/div><\/div><div class=\"qi\"><i>5<\/i><div>Co byś powiedział sobie z czwartku rano?<\/div><\/div><h3>Advanced: start<\/h3><div class=\"sub\">Śr 18.11, ok. 18:00, parking OW Bystre<\/div><div class=\"qi\"><i>1<\/i><div>Kim jesteś poza pracą? Kto Cię ukształtował?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Dlaczego tu jesteś? Co chcesz sobie udowodnić?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Czego się boisz najbardziej przez te dni?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Kto wie, że tu jesteś, i co Ci powiedział?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>Byłeś już na szkoleniach SSwB. Czego Ci brakowało?<small>Nawiązanie do wydarzenia 1 z 2<\/small><\/div><\/div><div class=\"qi\"><i>6<\/i><div>Jak się przygotowywałeś do Advanced? Od kiedy i co robiłeś?<small>Pytanie o przygotowanie<\/small><\/div><\/div><div class=\"qi\"><i>7<\/i><div>Co przygotowałeś ciałem, a co głową?<small>Pytanie o przygotowanie<\/small><\/div><\/div><div class=\"qi\"><i>8<\/i><div>Czego nie udało Ci się przygotować?<small>Pytanie o przygotowanie<\/small><\/div><\/div><h3>Advanced: w trakcie<\/h3><div class=\"sub\">Po kilku godzinach w terenie<\/div><div class=\"qi\"><i>1<\/i><div>Co Cię teraz trzyma w grze?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Co zrobisz, kiedy będziesz miał dość o 3 w nocy?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Gdzie jest Twoja granica? Widziałeś ją już?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>O czym myślisz, idąc?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>Jaki jesteś, kiedy jesteś na dnie? Znasz tę wersję siebie?<\/div><\/div><div class=\"qi\"><i>6<\/i><div>Kto z grupy Cię zaskoczył i czym?<\/div><\/div><h3>Advanced: finał<\/h3><div class=\"sub\">Pt 20.11 18:00 z Pitusiem, Sob 21.11 15:15 Chata Studencka<\/div><div class=\"qi\"><i>1<\/i><div>Czego się o sobie dowiedziałeś, czego nie wiedziałeś w środę?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Który moment był najtrudniejszy i co wtedy zrobiłeś?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Co byś powiedział sobie z środy wieczorem?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Komu z bliskich opowiesz to jako pierwszemu i co powiesz?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>Co zabierasz do domu, do pracy, do rodziny?<\/div><\/div><div class=\"qi\"><i>6<\/i><div>To nowy produkt, a Wy jesteście pierwszą grupą. Co byś powiedział następnej?<small>Nawiązanie do wydarzenia 2 z 2<\/small><\/div><\/div><div class=\"txt\">Pytania o 3 w nocy i o granicę są wspólne dla Extreme i Advanced, więc w montażu można zestawić odpowiedzi obu grup.<\/div>"},{"id":"ins","title":"Pytania do instruktorów w każdym punkcie programu","html":"<div class=\"txt\">Pytania zadajemy instruktorom prowadzącym dany punkt, na gorąco, krótko, najlepiej tuż po aktywności albo w przerwie. Jedno-dwa pytania z listy wystarczą. Instruktorzy i godziny pochodzą z zakładki Plan godzinowy.<\/div><div class=\"kv\"><div class=\"t\">B04 · Śr 18.11, 16:00 · Wiata Rabe<\/div><div class=\"row\"><b>Co się tam dzieje: <\/b>Start Challenge: powitanie, cele fundacji<\/div><div class=\"row\"><b>Do kogo: <\/b>Karaś, Krafcu<\/div><div class=\"txt\">1. Po co jest Challenge i dla kogo?<br/>2. Co chcesz, żeby młodzież stąd zabrała?<br/>3. Co Cię najbardziej martwi i cieszy przed startem?<\/div><\/div><div class=\"kv\"><div class=\"t\">B05 · Śr 18.11, 17:20 · Wiata Rabe (marsz Challenge)<\/div><div class=\"row\"><b>Co się tam dzieje: <\/b>Szybki marsz, kaczy chód, jumping<\/div><div class=\"row\"><b>Do kogo: <\/b>Czarny, Jacek Górka<\/div><div class=\"txt\">1. Dlaczego zaczynacie od tak ostrego marszu?<br/>2. Na co patrzysz w pierwszych minutach?<br/>3. Po czym poznajesz, kto sobie poradzi?<\/div><\/div><div class=\"kv\"><div class=\"t\">B07 · Śr 18.11, 18:20 · Parking OW Bystre<\/div><div class=\"row\"><b>Co się tam dzieje: <\/b>Start Advanced, początek głodówki<\/div><div class=\"row\"><b>Do kogo: <\/b>Instruktorzy Advanced<\/div><div class=\"txt\">1. Czym Advanced różni się od tego, co uczestnicy znają z SSwB?<br/>2. Dlaczego głodówka już na starcie?<br/>3. Czego się po tej grupie spodziewasz?<\/div><\/div><div class=\"kv\"><div class=\"t\">B09 · Śr 18.11, 20:30 · Parking OW Bystre (marsz Advanced)<\/div><div class=\"row\"><b>Co się tam dzieje: <\/b>Szybki marsz z ćwiczeniami<\/div><div class=\"row\"><b>Do kogo: <\/b>Daro<\/div><div class=\"txt\">1. Jaki ma być efekt tego marszu?<br/>2. Co jest największym błędem uczestników na początku?<\/div><\/div><div class=\"kv\"><div class=\"t\">B14 · Czw 19.11, 01:00 · Przełęcz<\/div><div class=\"row\"><b>Co się tam dzieje: <\/b>Challenge: sen i pobudka w nocy<\/div><div class=\"row\"><b>Do kogo: <\/b>Wojtek (Karaś), instruktorzy Challenge<\/div><div class=\"txt\">1. Po co ta pobudka w środku nocy?<br/>2. Jak młodzi reagują, kiedy ich budzicie?<br/>3. Co chcesz im pokazać przez brak snu?<\/div><\/div><div class=\"kv\"><div class=\"t\">B19 · Czw 19.11, 05:00 do tego popycha?<\/div><\/div><div class=\"qi\"><i>2<\/i><div>Jakie cechy wspólne widzisz w ludziach, którzy przechodzą selekcję do GROM-u, i w tych, którzy przyjeżdżają tutaj?<\/div><\/div><div class=\"qi\"><i>3<\/i><div>Czy da się po kilku godzinach zobaczyć, kto da radę, a kto nie?<\/div><\/div><div class=\"qi\"><i>4<\/i><div>Co dzieje się w głowie człowieka po 24 godzinach bez snu i jedzenia?<\/div><\/div><div class=\"qi\"><i>5<\/i><div>W którym momencie ludzie najczęściej odpuszczają i co wtedy myślą?<\/div><\/div><div class=\"qi\"><i>6<\/i><div>Co pozwala wytrzymać wtedy, kiedy ciało już nie daje rady?<\/div><\/div><div class=\"qi\"><i>7<\/i><div>Co psycholog widzi na selekcji, czego nie widzi nikt inny?<\/div><\/div><div class=\"qi\"><i>8<\/i><div>Czym się różni człowiek, który odpada, od tego, który zostaje?<\/div><\/div><div class=\"qi\"><i>9<\/i><div>Co sprawdza się lepiej: siła, spryt czy odporność psychiczna?<\/div><\/div><div class=\"qi\"><i>10<\/i><div>Jak można mentalnie przygotować się do selekcji?<\/div><\/div><div class=\"qi\"><i>11<\/i><div>Czym różni się człowiek, który przychodzi na Advanced po szkoleniach, od tego, który zaczyna od zera?<\/div><\/div><div class=\"qi\"><i>12<\/i><div>Co zmienia się w człowieku po takim wyjeździe i czy to się utrzymuje po powrocie do domu?<\/div><\/div><div class=\"qi\"><i>13<\/i><div>Jak ludzie wracają do normalnego życia po takich przeżyciach?<\/div><\/div><h3>Pytania do Pitusia<\/h3><div class=\"qi\"><i>1<\/i><div>Jakie cechy wspólne widzisz w ludziach, którzy przyjeżdżają tutaj, i w ludziach, którzy idą do jednostek specjalnych?<\/div><\/div>"},{"id":"pod","title":"Podział ekip","html":"<div class=\"txt\">Zasada: rozdzielamy się tylko tam, gdzie nikogo nie trzeba wozić, więc Mikołaj nie jest kierowcą w żadnym oknie. Jedyne auto to KIA RIO (trzy osoby). Podział działa tylko wtedy, gdy oba miejsca są na tym samym terenie i dojście pieszo trwa kilka minut. Wszędzie, gdzie trzeba by kogoś wozić, nie dzielimy.<\/div><div class=\"kv\"><div class=\"t\">Śr 18.11 19:00-20:30<\/div><div class=\"row\"><b>Konrad: <\/b>Odprawa Extreme w salce hotelu (film).<\/div><div class=\"row\"><b>Andrzej: <\/b>Advanced: zaklejanie ust i marsz do stacji wyciągu 19:30-20:30.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Odprawa Extreme, ustalenie z Karasiem, co wolno pokazać.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Wszystko w kompleksie hotelu, dojście pieszo kilkadziesiąt metrów.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Czw 19.11 05:00-06:30<\/div><div class=\"row\"><b>Konrad: <\/b>Start Extreme: zbiórka, sprawdzanie sprzętu, motywacja (film).<\/div><div class=\"row\"><b>Andrzej: <\/b>Wejściowe wywiady z kursantami 'czego spodziewasz się po Extreme' (z Mikołajem).<\/div><div class=\"row\"><b>Mikołaj: <\/b>Wejściowe wywiady z Andrzejem kamerą.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Hotel Bystre, parking i hala, kilkadziesiąt metrów.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Czw 19.11 10:05-10:30<\/div><div class=\"row\"><b>Konrad: <\/b>Challenge: gra biznesowa i rozmowa w małej wiacie.<\/div><div class=\"row\"><b>Andrzej: <\/b>Advanced: strzelanie, etap I-II (Darek Polak), albo Extreme TCCC.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Z Konradem, rozmowa z Challenge.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Wszystko na terenie strzelnicy, 100-300 m pieszo.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Czw 19.11 12:00-14:00<\/div><div class=\"row\"><b>Konrad: <\/b>Killing house Advanced 12:00-12:30 i Extreme 13:00-13:30.<\/div><div class=\"row\"><b>Andrzej: <\/b>Extreme: etap IV, twarze w autobusie; Challenge: etapy I-II.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Z Konradem w killing house.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Ten sam teren.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Czw 19.11 15:00-16:30<\/div><div class=\"row\"><b>Konrad: <\/b>Wywiad grupy Challenge w dużej wiacie 15:00-16:00.<\/div><div class=\"row\"><b>Andrzej: <\/b>Extreme: walka wręcz (Karaś, Kali) 15:00-16:30.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Z Konradem, wywiad Challenge.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Ten sam teren.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Pt 20.11 19:00-21:25<\/div><div class=\"row\"><b>Konrad: <\/b>Domek, Extreme, dym (19:00-20:30), potem Solina.<\/div><div class=\"row\"><b>Andrzej: <\/b>To samo co Konrad.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Jedzie razem z ekipą 20:30 na Solinę (ok. 55 min).<\/div><div class=\"row\"><b>Wozić?: <\/b>TAK, gdyby dzielić: Domek i Solina dzieli ok. 55 min jazdy. Rozdzielenie wymagałoby, żeby ktoś odwiózł jednego z operatorów (19:30 + 55 min), wrócił po drugiego (ok. 20:25) i znowu 55 min: razem ok. 3 godziny jazdy, a operator sam w nocy bez auta.<\/div><div class=\"row\"><b>Decyzja: <\/b>NIE DZIELIMY. Wszyscy na Domek, wyjazd 20:30, na Solinie 21:25.<\/div><\/div><div class=\"kv\"><div class=\"t\">Sob 21.11 09:30-12:30<\/div><div class=\"row\"><b>Konrad: <\/b>Most linowy (Łukasz, Kali), stoisz w jednym miejscu.<\/div><div class=\"row\"><b>Andrzej: <\/b>TCCC (Darek, Kuba) i uwolnienie zakładnika (Jacek).<\/div><div class=\"row\"><b>Mikołaj: <\/b>Z Konradem przy moście.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Skały, 15 min pieszo między stacjami.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div><div class=\"kv\"><div class=\"t\">Sob 21.11 14:00-16:30<\/div><div class=\"row\"><b>Konrad: <\/b>Test wodny Advanced, potem Chata Studencka.<\/div><div class=\"row\"><b>Andrzej: <\/b>To samo co Konrad.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Jedzie z ekipą, KIA zostaje, dalej Toyotą z instruktorem.<\/div><div class=\"row\"><b>Wozić?: <\/b>TAK, gdyby dzielić: Extreme (start marszu nocnego 14:30-16:30) jest w innym miejscu, a do Chaty Studenckiej nie da się dojechać. Potrzebna druga Toyota.<\/div><div class=\"row\"><b>Decyzja: <\/b>NIE DZIELIMY. Wszyscy na Advanced, potem Huczwice.<\/div><\/div><div class=\"kv\"><div class=\"t\">Nd 22.11 13:00-17:00<\/div><div class=\"row\"><b>Konrad: <\/b>Wywiady indywidualne z uczestnikami (osobna sala).<\/div><div class=\"row\"><b>Andrzej: <\/b>Ujęcia hotelu: obsługa pontonów, obiad, pożegnania.<\/div><div class=\"row\"><b>Mikołaj: <\/b>Z Konradem, prowadzi wywiady.<\/div><div class=\"row\"><b>Wozić?: <\/b>Nie. Hotel.<\/div><div class=\"row\"><b>Decyzja: <\/b>DZIELIMY<\/div><\/div>"},{"id":"zag","title":"Zagrożenia","html":"<div class=\"kv\"><div class=\"t\">Dojazd na strzelnicę<\/div><div class=\"row\"><b>Kiedy: <\/b>Czw 07:50 i 17:15<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Ok. 1 h 10 min jazdy serpentynami (z zapasem), rano ciemno, wieczorem ciemno. Gołoledź, mgła, zwierzyna.<\/div><div class=\"row\"><b>Skutek: <\/b>Opóźnienie lub wypadek. Czas to szacunek.<\/div><div class=\"row\"><b>Co robimy: <\/b>Wyjazd 07:50, powrót 17:15. Zimowe opony potwierdzić. Prowadzi Mikołaj.<\/div><div class=\"row\"><b>Pieszo: <\/b>Nie<\/div><\/div><div class=\"kv\"><div class=\"t\">Strzelnica Bukowsko<\/div><div class=\"row\"><b>Kiedy: <\/b>Czw 09:00-17:15<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Broń palna, strzelanie, killing house, bieg przez przeszkody, drony.<\/div><div class=\"row\"><b>Skutek: <\/b>Zagrożenie dla ludzi i sprzętu.<\/div><div class=\"row\"><b>Co robimy: <\/b>Strefa bezpieczna z Pawłem, okulary i słuchawki, kamera poza linią ognia, medyk obowiązkowo w killing house.<\/div><div class=\"row\"><b>Pieszo: <\/b>Dużo: bieg po terenie z kamerą<\/div><\/div><div class=\"kv\"><div class=\"t\">Chata Studencka<\/div><div class=\"row\"><b>Kiedy: <\/b>Śr 13:30-15:30 (pomijamy), Sob 15:00-16:00<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Nie da się dojechać (potwierdzone). Brak prądu i zasięgu (opinie Google).<\/div><div class=\"row\"><b>Skutek: <\/b>Bez Toyoty z instruktorem dojście pieszo ok. 1 h 45 min w jedną stronę.<\/div><div class=\"row\"><b>Co robimy: <\/b>Toyota (HILUX) z instruktorem, wyjazd 14:40 z jeziorka. KIA zostaje. Szczegóły w arkuszu 'Dojścia pieszo i transport'.<\/div><div class=\"row\"><b>Pieszo: <\/b>Tak, ok. 1 h 45 min z Wiaty Rabe<\/div><\/div><div class=\"kv\"><div class=\"t\">Huczwice<\/div><div class=\"row\"><b>Kiedy: <\/b>Sob 16:00-23:10<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Nie wiem, czy da się dojechać autem (do potwierdzenia). Brak zasięgu, prąd z agregatu.<\/div><div class=\"row\"><b>Skutek: <\/b>Dojście pieszo z Chaty Studenckiej ok. 1 h 50 min.<\/div><div class=\"row\"><b>Co robimy: <\/b>Toyota. Jeśli nie da się dojechać: pieszo z Wiaty Rabe ok. 55 min.<\/div><div class=\"row\"><b>Pieszo: <\/b>Możliwe<\/div><\/div><div class=\"kv\"><div class=\"t\">Szopa<\/div><div class=\"row\"><b>Kiedy: <\/b>Czw 23:30-02:00<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Noc, worki na głowach, kajdanki, marsz pod górkę, upadki, zimno. Trzeba ustalić z Karasiem, co wolno pokazać.<\/div><div class=\"row\"><b>Skutek: <\/b>Wypadek z udziałem kursanta, w kadrze coś, czego nie wolno pokazać.<\/div><div class=\"row\"><b>Co robimy: <\/b>Stoisz poza trasą, światło tylko za zgodą, lekki sprzęt, wracasz o 02:00.<\/div><div class=\"row\"><b>Pieszo: <\/b>Tak, noc, pod górę<\/div><\/div><div class=\"kv\"><div class=\"t\">Staw, skok do wody<\/div><div class=\"row\"><b>Kiedy: <\/b>Pt 11:30<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Zimna woda w listopadzie, śliski brzeg, wychłodzenie.<\/div><div class=\"row\"><b>Skutek: <\/b>Zalanie sprzętu, upadek operatora.<\/div><div class=\"row\"><b>Co robimy: <\/b>Kamera w obudowie, stoisz na brzegu, nie wchodzisz. Ratownik i WOPR są w logistyce.<\/div><div class=\"row\"><b>Pieszo: <\/b>Możliwe 10-20 min od parkingu<\/div><\/div><div class=\"kv\"><div class=\"t\">Bagno i paintball<\/div><div class=\"row\"><b>Kiedy: <\/b>Pt 12:00<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Błoto, kulki, poślizg.<\/div><div class=\"row\"><b>Skutek: <\/b>Zabrudzony obiektyw i sprzęt.<\/div><div class=\"row\"><b>Co robimy: <\/b>Osłony na obiektyw, ściereczki, okulary ochronne (25 szt. w logistyce).<\/div><div class=\"row\"><b>Pieszo: <\/b>Teren podmokły<\/div><\/div><div class=\"kv\"><div class=\"t\">Domek (dym)<\/div><div class=\"row\"><b>Kiedy: <\/b>Pt 19:00-20:30<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Dym, ciemność, walka wręcz, klaustrofobia.<\/div><div class=\"row\"><b>Skutek: <\/b>Dym i ostre światło psują obraz i ostrość.<\/div><div class=\"row\"><b>Co robimy: <\/b>Zadymiarka i stroboskop (zadania Konrada w tabeli). Wejście z Karasiem, wyjście do 20:30.<\/div><div class=\"row\"><b>Pieszo: <\/b>Nie<\/div><\/div><div class=\"kv\"><div class=\"t\">Solina w nocy<\/div><div class=\"row\"><b>Kiedy: <\/b>Pt 21:25-00:20<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Noc, woda, wiatr, zimno, ślisko na zaporze. Dwa wydarzenia (Advanced, Extreme).<\/div><div class=\"row\"><b>Skutek: <\/b>Zalanie, wypadek, zmęczenie.<\/div><div class=\"row\"><b>Co robimy: <\/b>Operator na brzegu, czołówki i lampy, ciepłe ubrania na 3 godziny na zimnie.<\/div><div class=\"row\"><b>Pieszo: <\/b>Kilkaset metrów po brzegu<\/div><\/div><div class=\"kv\"><div class=\"t\">Jazda Solina do Bystre<\/div><div class=\"row\"><b>Kiedy: <\/b>Pt 00:20-01:10<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Nocna jazda zmęczonego kierowcy, zwierzyna, ok. 50 min.<\/div><div class=\"row\"><b>Skutek: <\/b>Wypadek.<\/div><div class=\"row\"><b>Co robimy: <\/b>Kto prowadzi, do ustalenia (najlepiej ten, kto miał więcej snu). Wyjazd najpóźniej 00:20.<\/div><div class=\"row\"><b>Pieszo: <\/b>Nie<\/div><\/div><div class=\"kv\"><div class=\"t\">Przeprawa przez San i skały<\/div><div class=\"row\"><b>Kiedy: <\/b>Sob 07:45-12:30<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Zimna woda, ślisko, liny, mokre skały, ciężki sprzęt, 15 min pieszo między stacjami.<\/div><div class=\"row\"><b>Skutek: <\/b>Upadek, zalanie, zmęczenie.<\/div><div class=\"row\"><b>Co robimy: <\/b>Lekki zestaw, stoisz w jednym miejscu przy moście i przy TCCC, nie pod linami.<\/div><div class=\"row\"><b>Pieszo: <\/b>Tak, 15 min między stacjami<\/div><\/div><div class=\"kv\"><div class=\"t\">Meta marszu Huczwice<\/div><div class=\"row\"><b>Kiedy: <\/b>Sob 16:30-19:00<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Całość po zachodzie słońca (ok. 15:45, szacunek). Prąd zależy od agregatu. Zimno.<\/div><div class=\"row\"><b>Skutek: <\/b>Za mało światła, żeby nagrać uczestników docierających do mety.<\/div><div class=\"row\"><b>Co robimy: <\/b>Lampy, czołówki, statyw, drugie źródło światła. Ustaw światło o 16:30.<\/div><div class=\"row\"><b>Pieszo: <\/b>Ostatnie 500 m z lampą<\/div><\/div><div class=\"kv\"><div class=\"t\">Sen i zmęczenie kierowcy<\/div><div class=\"row\"><b>Kiedy: <\/b>Cały plan<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Najkrótsze noce: środa 3 h 30 min (2 h plus 1 h 30 min, z wyjazdem na przełęcz o 00:10), czwartek 2 h 30 min plus 5 h 30 min po Szopie, piątek 4 h 20 min. trzy nocne jazdy (czw 02:00, pt 00:20, sob 22:30), kierowca do ustalenia.<\/div><div class=\"row\"><b>Skutek: <\/b>Błędy, wypadek, słaba jakość.<\/div><div class=\"row\"><b>Co robimy: <\/b>Jeśli za mało snu, odpuść Szopę po 01:00 albo Solinę Extreme. Zmieniajcie się za kierownicą w drodze powrotnej.<\/div><div class=\"row\"><b>Pieszo: <\/b>-<\/div><\/div><div class=\"kv\"><div class=\"t\">Zasięg i łączność<\/div><div class=\"row\"><b>Kiedy: <\/b>Rabe, Studencka, Huczwice, Szopa<\/div><div class=\"row\"><b>Zagrożenie: <\/b>Brak zasięgu na wiacie (opinie) i w Chacie Studenckiej.<\/div><div class=\"row\"><b>Skutek: <\/b>Nie damy znać, że się spóźniamy.<\/div><div class=\"row\"><b>Co robimy: <\/b>Umówione godziny kontaktu, krótkofalówki, plan B w Baligrodzie.<\/div><div class=\"row\"><b>Pieszo: <\/b>-<\/div><\/div>"},{"id":"zao","title":"Zaopatrzenie","html":"<h3>Sklep<\/h3><div class=\"k <script>
(function () {

/* ---------- Czas ---------- */
D.days.forEach(function (d, i) {

  d.lanes.forEach(function (l) { l.bars.forEach(function (b) { b.l = l; b.d = d; b.a = d.t0 + b.s * 6e4; b.b = d.t0 + b.e * 6e4; }); });
});
var ALL = [];
D.days.forEach(function (d) { ALL = ALL.concat(d.cards); });
ALL.sort(function (x, y) { return x.a - y.a; });

function todayIdx(now) {
  var t = new Date(now); t.setHours(0, 0, 0, 0);
  for (var i = 0; i < D.days.length; i++) if (D.days[i].t0 === t.getTime()) return i;
  return now < D.days[0].t0 ? 0 : now > ALL[ALL.length - 1].b ? D.days.length - 1 : -1;
}
function isToday(d, now) { var t = new Date(now); t.setHours(0, 0, 0, 0); return d.t0 === t.getTime(); }
function status(now) {
  var cur = null, nxt = null;
  for (var i = 0; i < ALL.length; i++) {
    var c = ALL[i];
    if (c.a <= now && now < c.b) cur = c;
    if (c.a > now && !nxt) nxt = c;
  }

}
function dur(ms) {

  if (m < 60) return m + ' min';
  var h = Math.floor(m / 60), r = m % 60;
  if (h >= 24) { var dd = Math.floor(h / 24), hh = h % 24; return dd + ' d' + (hh ? ' ' + hh + ' h' : ''); }
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}
function passFilter(evs) { return st.filter === 'all' || evs.indexOf(st.filter) >= 0; }

/* ---------- Karta bloku ---------- */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  var pills = '';

  c.tags.forEach(function (t) { pills += '<span class="pill' + (t === 'MUST' ? ' must' : '') + '">' + esc(t) + '</span>'; });
  return '<div class="' + cls + '" data-k="' + esc(c.k) + '" style="--tc:' + (TYPEC[c.type] || '#555') + '">'

document.addEventListener('click', function (e) {

  var head = e.target.closest('.ch');
  if (head && card) { card.classList.toggle('open'); return; }
});

/* ---------- Gantt ---------- */
function ganttHTML(d, now, opts) {
  opts = opts || {};
  var ppm = ZOOMS[st.zoom], a0 = d.axis[0], a1 = d.axis[1], W = Math.round((a1 - a0) * ppm), LW = 58;

  lanes.forEach(function (l, li) {

    bars.forEach(function (b) {
      var k = KIND[b.kind] || ['', null];

      var cls = 'gb ' + b.kind + (b.b <= now ? ' past' : '') + (b.a <= now && now < b.b ? ' cur' : '');
      var x = Math.max(0, (b.s - a0) * ppm), w = Math.max(5, (b.e - Math.max(b.s, a0)) * ppm - 2);
      h += '<button class="' + cls + '" data-bar="' + d.i + ',' + d.lanes.indexOf(l) + ',' + l.bars.indexOf(b) + '" style="left:' + x + 'px;width:' + w + 'px;top:' + (4 + b._r * 34) + 'px;--c:' + l.c + ';--bg2:' + bg + '" title="' + esc((b.lt ? b.lt + ' ' : '') + b.t) + '">' + esc(b.t) + '</button>';

}
function placeNow(now) {

    n.style.left = (+n.dataset.lw + x - 1) + 'px';
    n.firstChild.textContent = hm(new Date(now).getHours() * 60 + new Date(now).getMinutes());
  });
}
function scrollGantt(gw, now) {
  var n = gw.querySelector('.gnow');

document.addEventListener('click', function (e) {

function cardAt(t) {

  if (c) {
    if (l.id !== 'my') h += '<div class="sec-h"><h2>My w tym czasie</h2></div>';
    h += cardHTML(c, now, { open: l.id === 'my' });
  }

}
function openSheet(html) {

  $('#sh').scrollTop = 0;
  $('#ov').classList.add('open'); $('#sh').classList.add('open');
}
function closeSheet() { $('#ov').classList.remove('open'); $('#sh').classList.remove('open'); }
$('#ov').addEventListener('click', closeSheet);
(function () {
  var y0 = null, sh = $('#sh');
  sh.addEventListener('touchstart', function (e) { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener('touchend', function (e) { if (y0 != null && e.changedTouches[0].clientY - y0 > 80) closeSheet(); y0 = null; });
})();

/* ---------- Widoki ---------- */
var view = st.view || 'now';
var infoOpen = null;
function dayChips(sel, key, now) {

  if (cur) {
    var pct = Math.min(100, (now - cur.a) / (cur.b - cur.a) * 100);
    h += '<div class="hero" style="--tc:' + (TYPEC[cur.type] || '#555') + '"><div class="kick"><span class="live"></span>Teraz · ' + esc(cur.type) + (cur.tags.indexOf('MUST') >= 0 ? ' · MUST' : '') + '</div>'
      + '<h1>' + esc(cur.pl) + '</h1><div class="when">' + hm(cur.s) + ' – ' + hm(cur.e) + ' · ' + esc(cur.dur) + (cur.code ? ' · ' + esc(cur.code) : '') + '</div>'
      + '<div class="pbar"><i id="hp" style="width:' + pct + '%"></i></div>'
      + '<div class="prow"><span>Minęło <b id="hel">' + dur(now - cur.a) + '</b></span><span>Zostało <b id="hrem">' + dur(cur.b - now) + '</b></span></div>'
      + '<button class="more" data-more>Szczegóły</button><div class="bd" hidden>' + cur.bd + '</div></div>';
  } else if (!nxt) {
    h += '<div class="hero"><div class="kick">Koniec</div><h1>Wyjazd zakończony</h1><div class="when">Wszystkie bloki minęły.</div></div>';
  } else {
    var before = now < ALL[0].a;
    h += '<div class="hero" style="--tc:#444"><div class="kick" style="color:var(--tx2)">' + (before ? 'Przed wyjazdem' : 'Przerwa') + '</div>'
      + '<h1>' + (before ? 'Start za ' : 'Kolejny blok za ') + '<span id="hrem">' + dur(nxt.a - now) + '</span></h1>'
      + '<div class="when">' + nxt.d.short + ', ' + hm(nxt.s) + ' · ' + esc(nxt.pl) + '</div></div>';
  }
  if (nxt && cur) {
    h += '<button class="nxt" data-open="' + esc(nxt.k) + '"><div class="t">' + hm(nxt.s) + '</div><div><div class="k">Następne · za <span id="nin">' + dur(nxt.a - now) + '</span></div><div class="p">' + esc(nxt.pl) + '</div><div class="k" style="font-weight:600;letter-spacing:0;text-transform:none;margin-top:2px">' + esc(nxt.type) + ' · ' + esc(nxt.dur) + '</div></div></button>';
  }

  // Co robią grupy
  var ti = todayIdx(now);
  var gl = [];
  D.days.forEach(function (d) { d.lanes.forEach(function (l) {
    if (l.id === 'my' || !(st.filter === 'all' || st.filter === l.id)) return;
    l.bars.forEach(function (b) { if (b.a <= now && now < b.b) gl.push(b); });
  }); });
  h += '<div class="sec-h"><h2>Grupy teraz</h2></div><div class="grp">';
  h += gl.length ? gl.map(function (b) {
    var g = GROUPS[b.l.id];
    return '<div class="gi" data-bar="' + b.d.i + ',' + b.d.lanes.indexOf(b.l) + ',' + b.l.bars.indexOf(b) + '"><span class="lb" style="--c:' + g.c + '">' + g.s + '</span><div class="x">' + esc(b.t) + '<small>' + (b.lt || hm(b.s)) + ' – ' + hm(b.e) + ' · zostało ' + dur(b.b - now) + '</small></div></div>';
  }).join('') : '<div class="empty">Żadna grupa nie ma teraz punktu programu</div>';
  h += '</div>';

  // Gantt dnia
  var gd = D.days[ti < 0 ? 0 : ti];
  h += '<div class="sec-h"><h2>Gantt · ' + gd.short + '</h2><button data-go="gantt">Pełny widok</button></div>' + ganttHTML(gd, now);

  // Dalej
  var rest = ALL.filter(function (c) { return c.a > now && c !== nxt && passFilter(c.ev); }).slice(0, 4);
  if (rest.length) {
    h += '<div class="sec-h"><h2>Dalej</h2><button data-go="plan">Cały plan</button></div>';
    h += rest.map(function (c) { return cardHTML(c, now); }).join('');
  }
  $('#main').innerHTML = h;
  document.querySelectorAll('.gw').forEach(function (g) { placeNow(now); scrollGantt(g, now); });
}

function renderPlan(now) {
  var di = selDay('pday', now), d = D.days[di];
  var cards = d.cards.filter(function (c) { return passFilter(c.ev); });
  var h = '<div class="prog"><span id="pg"></span><div class="pbar"><i id="pgb"></i></div></div>';
  var lineDone = !isToday(d, now);
  cards.forEach(function (c, i) {
    if (!lineDone && c.a > now) { h += '<div class="nowline">' + hm(new Date(now).getHours() * 60 + new Date(now).getMinutes()) + ' teraz</div>'; lineDone = true; }
    h += cardHTML(c, now, { next: c === status(now).nxt });
  });
  if (!cards.length) h += '<div class="empty">Brak bloków dla tego filtra</div>';
  $('#main').innerHTML = h;
  updateProg();
}
function updateProg() {
  var pg = $('#pg'); if (!pg || view !== 'plan') return;
  var d = D.days[st.pday];
  var cards = d.cards.filter(function (c) { return passFilter(c.ev); });
  var n = cards.filter(function (c) { return st.done[c.k]; }).length;
  pg.textContent = 'Zrobione ' + n + ' z ' + cards.length;
  $('#pgb').style.width = (cards.length ? n / cards.length * 100 : 0) + '%';
}

function renderGantt(now) {
  var di = selDay('gday', now), d = D.days[di];
  var h = '<div class="gtools"><button data-z="-1" aria-label="Pomniejsz">−</button><button data-z="1" aria-label="Powiększ">+</button><span class="sp"></span>'
    + (isToday(d, now) ? '<button class="r" data-gnow>Teraz</button>' : '') + '</div>';
  h += ganttHTML(d, now);
  h += '<div class="legend">' + ['myf', 'myd', 'myl', 'myp', 'mys'].map(function (k) { return '<span style="--b:' + KIND[k][1] + '">' + KIND[k][0] + '</span>'; }).join('')
    + '<span style="--b:#3B8EDB66">Must</span><span style="--b:#3B8EDB30">Warto</span><span style="--b:#3B8EDB1f">Pomocnicze</span></div>';
  h += '<div class="sec-h"><h2>Bloki dnia</h2></div>';
  h += d.cards.filter(function (c) { return passFilter(c.ev); }).map(function (c) { return cardHTML(c, now); }).join('');
  $('#main').innerHTML = h;
  var gw = $('.gw'); placeNow(now); scrollGantt(gw, now);
}

var ICONS = { zal: '🎯', wyw: '🎤', ins: '🧭', kas: '🧠', pod: '👥', zag: '⚠️', zao: '🛒', pa: '🛟', wyd: '📅', dys: '🚗', doj: '🥾' };
function renderInfo() {
  var h;
  if (infoOpen) {
    var it = D.info.filter(function (x) { return x.id === infoOpen; })[0];
    h = '<div class="info fl-' + st.filter + '"><button class="back" data-back>‹ Info</button><h1>' + esc(it.title) + '</h1>' + it.html + '</div>';
  } else {
    h = '<div class="ilist">' + D.info.map(function (it) {
      var n = (it.html.match(/class="(kv|qi)[ "]/g) || []).length;
      return '<button data-info="' + it.id + '"><span class="ic">' + (ICONS[it.id] || '•') + '</span><span class="tt">' + esc(it.title) + (n ? '<small>' + n + ' pozycji</small>' : '') + '</span><span class="ch2">›</span></button>';
    }).join('') + '</div>';
  }
  $('#main').innerHTML = h;
}

var TITLES = { now: 'Teraz', plan: 'Plan dnia', gantt: 'Gantt', info: 'Info' };
var sig = '';
function render(keepScroll) {
  var now = Date.now();
  var y = window.scrollY;
  $('#vt').textContent = view === 'info' && infoOpen ? 'Info' : TITLES[view];
  var c = '';
  if (view === 'plan') c = dayChips(selDay('pday', now), 'pday', now) + filterChips();
  else if (view === 'gantt') c = dayChips(selDay('gday', now), 'gday', now) + filterChips();
  else if (view === 'now' || (view === 'info' && infoOpen === 'wyd')) c = filterChips();
  $('#ctrl').innerHTML = c;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === view); });
  if (view === 'now') renderNow(now);
  else if (view === 'plan') renderPlan(now);
  else if (view === 'gantt') renderGantt(now);
  else renderInfo();
  var s = status(now); sig = (s.cur && s.cur.k) + '|' + (s.nxt && s.nxt.k) + '|' + todayIdx(now);
  if (keepScroll) window.scrollTo(0, y);
  tick();
}
function tick() {
  var now = Date.now(), d = new Date(now);
  $('#clk').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) + '<small>' + d.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' }) + '</small>';
  var s = status(now);
  var ns = (s.cur && s.cur.k) + '|' + (s.nxt && s.nxt.k) + '|' + todayIdx(now);
  if (ns !== sig && !$('#sh').classList.contains('open')) { render(true); return; }
  if (s.cur) {
    var hp = $('#hp'); if (hp) hp.style.width = Math.min(100, (now - s.cur.a) / (s.cur.b - s.cur.a) * 100) + '%';
    var he = $('#hel'); if (he) he.textContent = dur(now - s.cur.a);
    var hr = $('#hrem'); if (hr) hr.textContent = dur(s.cur.b - now);
  } else if (s.nxt) { var hr2 = $('#hrem'); if (hr2) hr2.textContent = dur(s.nxt.a - now); }
  var ni = $('#nin'); if (ni && s.nxt) ni.textContent = dur(s.nxt.a - now);
  placeNow(now);
}

/* ---------- Nawigacja ---------- */
document.addEventListener('click', function (e) {
  var t;
  if ((t = e.target.closest('#tabs button'))) {
    if (view === t.dataset.v && view === 'info') infoOpen = null;
    view = t.dataset.v; st.view = view; save(); render(); window.scrollTo(0, 0); return;
  }
  if ((t = e.target.closest('[data-seg] button'))) { st[t.parentElement.dataset.seg] = +t.dataset.i; save(); render(); window.scrollTo(0, 0); return; }
  if ((t = e.target.closest('[data-f]'))) { st.filter = t.dataset.f; save(); render(true); return; }
  if ((t = e.target.closest('[data-go]'))) { view = t.dataset.go; st.view = view; var ti = todayIdx(Date.now()); if (ti >= 0) { st.pday = ti; st.gday = ti; } save(); render(); window.scrollTo(0, 0); return; }
  if ((t = e.target.closest('[data-info]'))) { infoOpen = t.dataset.info; render(); window.scrollTo(0, 0); return; }
  if ((t = e.target.closest('[data-back]'))) { infoOpen = null; render(); window.scrollTo(0, 0); return; }
  if ((t = e.target.closest('[data-z]'))) { st.zoom = Math.max(0, Math.min(ZOOMS.length - 1, st.zoom + +t.dataset.z)); save(); render(true); return; }
  if ((t = e.target.closest('[data-gnow]'))) { var g = $('.gw'); scrollGantt(g, Date.now()); return; }
  if ((t = e.target.closest('[data-more]'))) { var bd = t.nextElementSibling; bd.hidden = !bd.hidden; t.textContent = bd.hidden ? 'Szczegóły' : 'Zwiń'; return; }
  if ((t = e.target.closest('[data-open]'))) { openSheet(cardHTML(BYK[t.dataset.open], Date.now(), { open: true, next: true })); return; }
});

var toastT;
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2000); }
addEventListener('offline', function () { toast('Offline — wszystko działa dalej'); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { var ti = todayIdx(Date.now()); render(true); } });

render();
setInterval(tick, 15000);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
